# TonySwingETF 백테스트 파라미터
# 임계값은 소수(0.01 = 1%)

# 라이브 파이프라인이 참조하는 최상위 키 — 동결된 실험 섹션(ml/refine 등)은
# 재현용 사본만 갖고, 살아있는 코드는 여기만 본다.
main_stock: SKHynix        # 서브 트랙 주력 종목 (분석·사이징·손절·헬스체크 공용)

snapshot:
  # 아침 시장 스냅샷 (2026-08-11 등록) — 개장 전 세계 상태의 시점 기록.
  # 선물·환율 장중 시세는 소급 불가 → 매일 아침 프리뷰가 1행씩 축적.
  # 수집 전용: 어떤 신호·판정에도 쓰지 않는다. 향후 '아침 정보' 계열 가설을
  # 사전 등록할 때 정직한 point-in-time 재료가 된다 (paper/market_snapshots.csv).
  #
  # 개장(09:00) 이후 기록된 행은 '개장 전 정보'가 아니다 — 실제로 도입 당일
  # (2026-08-10)에 22:35 기록분이 1행 섞여 있다. 과거 행을 고쳐 쓰지 않고
  # taken_at 으로 판별한다: 기록 시 경고, 사용 시 load_snapshots(premarket_only=True).
  premarket_deadline: "09:00"
  tickers:
    "NQ=F": nasdaq_fut      # 나스닥100 선물 — 개장 전 글로벌 방향
    "ES=F": sp_fut          # S&P500 선물
    "KRW=X": usdkrw         # 원/달러 — 나스닥 ETF(환노출)와 직결
    "GC=F": gold_fut        # 금 선물 — 골드 월초 효과 후보의 아침 상태
    "ZN=F": us10y_fut       # 미 10년 국채 선물 — 국고채 ETF 후보와 직결

ops:
  # 운영 편의 계층 (신호·판정과 무관 — 조정해도 통계 오염 없음)
  virtual_capital: 10000000  # STATUS.md 주문 계획 환산용 가상 자본 (원)
  exposure: 0.41             # 총노출 — portfolio 부트스트랩 q5 캘리브레이션 권고
                             # (2026-08-10 반영: 구 점추정 0.58 → 분위수 기준 0.41)
  notify_signals: true       # 아침 신호 발동 시 데스크톱 알림
  legacy_codes: ["139660", "143850"]   # SwingETF 이관 잔여 매도 실패분 (2026-08-26 동결)
                             # — liquidate-legacy 는 이 목록만 매도한다. 실행기가 연
                             # 포지션을 오인 청산하는 사고 방지. 청산 완료 후 비울 것
  trade_mode: live_mock      # 아침 자동 실행기 모드: dry_run(계획만 기록) |
                             # live_mock(KIS 모의계좌 실제 제출 — 모의 전용 클라이언트).
                             # 운영 편의 값 — dry_run 로그가 며칠 깨끗하면 live_mock 전환 권장.
                             # 실계좌 경로는 코드에 없음 (판정+실전투입게이트 통과 전 금지)

data:
  start: "2015-01-01"
  kr_stocks:
    "005930": "SamsungElec"
    "000660": "SKHynix"
    "009150": "SamsungElecMech"
  kr_index:
    KS11: "KOSPI"
  us_symbols:
    "^IXIC": "NASDAQ"
    "^SOX": "SOX"
    NVDA: "NVDA"
  # 캐시 마지막 날짜가 오늘 기준 이 일수 이내면 재다운로드 생략
  cache_max_age_days: 3

cost:
  round_trip: 0.002   # 왕복 거래비용 0.2%

signals:
  sox:                # 전일(미국 D-1) SOX 수익률 구간
    up1: [0.01, null]       # > +1%
    up2: [0.02, null]       # > +2%
    down1: [null, -0.01]    # < -1%
    flat: [-0.01, 0.01]     # -1% ~ +1%
  nvda:               # 전일 NVDA 수익률 구간
    up2: [0.02, null]
    up3: [0.03, null]
    down2: [null, -0.02]
    flat: [-0.02, 0.02]
  kospi:              # 전날 KOSPI 종가 수익률
    up: [0.0, null]
    down: [null, 0.0]
  ma20:               # 전일 종가가 20일 이평선 위/아래
    above: true
    below: false
  gap:                # 당일 시가 갭 (시가/전일종가 - 1)
    up_big: [0.01, null]     # 갭업 +1% 이상
    up_small: [0.0, 0.01]    # 갭업 0~1%
    down: [null, 0.0]        # 갭다운
    down_big: [null, -0.01]  # 갭다운 -1% 이하 (역방향/되돌림 테스트)

backtest:
  min_samples: 30          # 이보다 표본이 적으면 순위 평가 제외
  max_combo: 2             # 단독 + 2개 조합 전부
  extra_combos:            # 사전 지정 3개짜리 조합 목록 (현재 4건)
    - [sox_up1, gap_up_small, ma20_above]
    - [sox_up2, gap_up_big, ma20_above]
    - [sox_down1, gap_down, kospi_down]
    - [nvda_up2, gap_up_small, ma20_above]

split:
  boundary: "2021-01-01"   # 전반부(~2020) / 후반부(2021~) 경계

robustness:
  costs: [0.002, 0.003, 0.005]   # 생존 조건 비용 민감도 테스트용 왕복 비용

report:
  top_n_chart: 5           # 누적수익 곡선에 그릴 상위 조건 수
  top_n_split: 10          # split 검증에 쓸 전반부 상위 조건 수

etf:
  # 메인 트랙: ETF 스윙 스크리닝 (Stage 1 — 탐색 단계임을 명시. 상위 후보는
  # Stage 2에서 사전 등록 후 섀도로 검증한다. 다중검정: 12종 x 4전략 = 48테스트)
  cost_round_trip: 0.001    # ETF는 거래세 면제 — 수수료+스프레드 왕복 0.1% 가정
                            # (스크리닝·장부용 일괄값 — 동결. 포워드 판정 통계는
                            #  etf.costs 로 실측한 results/etf_costs.csv 를 쓴다)
  costs:
    # ETF별 실측 비용 추정 파라미터 (2026-08-07 등록, `cost` 단계 — 성과 미참조).
    # 스프레드 = 호가단위 x 유동성 티어. 판정비용 = max(0.1% 일괄, 추정) —
    # 동결 가정보다 낮추는 방향은 금지 (낮추면 판정이 후해진다).
    # 일봉 Corwin-Schultz 는 변동성 오염(유동성과 역상관)으로 기각 — 참고 병기만.
    window_days: 504          # 최근 2년 — 판정 대상 기간의 유동성을 대표
    tick_krw: 5               # 한국 ETF 호가단위
    commission_per_side: 0.00015   # 온라인 브로커 편도 0.015%
    adv_tiers:                # [일평균 거래대금(억) 하한, 스프레드 틱수] 내림차순
      - [500, 1]              # LP 의무 호가 — 고유동성은 최우선호가 1틱
      - [100, 2]
      - [0, 4]                # 저유동성 보수 추정
  dist_check:
    # 분배금 편향 진단 (`distcheck` 단계) — 미조정 가격 백테스트의 왜곡 측정.
    # 채권 ETF만 대상: 연말 분배가 회당 1.2~4.0%로 커서 신호 오염 가능.
    codes: ["148070"]
    exit_window_days: 5       # 분배락 후 이 영업일 내 청산을 오발 의심으로 집계
  min_trades: 30
  max_hold: 10              # 기본 최대 보유일 (us_dip은 자체 hold_days 사용)
  universe:
    "069500": KODEX200
    "122630": KODEX_Lev
    "114800": KODEX_Inverse
    "229200": KODEX_KOSDAQ150
    "233740": KODEX_KOSDAQ150Lev
    "091160": KODEX_Semicon
    "305720": KODEX_Battery
    "133690": TIGER_NASDAQ100
    "132030": KODEX_Gold
    "091170": KODEX_Bank
    "102970": KODEX_Securities
    "091180": KODEX_Auto
  universe_ext:
    # 확장 유니버스 (2026-08-07 사전 등록) — 로테이션 기각 원인(횡단면 분산 부족)
    # 해소 + 생존 스윙 계열의 신자산군 적용. 선정 기준(성과 미참조 — 사전 고정):
    # 기존 유니버스에 없는 자산군마다 '역사가 충분한(가급적 2016 이전 상장) 대표
    # 유동성 상품 1개'. 데이터 시작은 어차피 data.start(2015) 캡. 데이터 가용성
    # 실패 시에만 동급 상품으로 대체하고 사유를 기록한다.
    "143850": TIGER_SP500H      # 미국 대형주 (S&P500 선물, 환헤지, 2011 상장)
    "099140": KODEX_ChinaH      # 중국 H주 (2007 상장)
    "101280": KODEX_Japan       # 일본 TOPIX100 (2008 상장)
    "148070": KOSEF_KTB10Y      # 국고채 10년 (2011 상장) — 방어 자산축
    "304660": KODEX_UST30YH     # 미국채 울트라30년 (환헤지, 2018 상장) — 위기 헤지
    "261240": KODEX_USD         # 미국달러선물 (2016 상장) — 원화 약세 헤지
    "130680": TIGER_OilH        # 원유선물 (환헤지, 2010 상장) — 원자재축
    "329200": TIGER_REITs       # 리츠/인프라 (2019 상장) — 부동산축
  # 확장 스크리닝(2026-08-07 사전 등록): 신자산 8종 x 생존 계열 3전략 = 24테스트.
  # 종결된 계열(rsi2/pullback/us_dip)은 신자산에도 재시험하지 않는다.
  # 게이트는 Stage 1과 동일. 통과분 전부(사후 선별 없음) Stage 2 후보 등록.
  ext_strategies: [breakout, macross, trend_ride]
  strategies:
    breakout:               # 추세추종: 20일 신고가 돌파 매수, MA10 이탈 청산
      lookback: 20
      exit_ma: 10
    macross:                # 추세추종: MA5/20 골든크로스 매수, 데드크로스 청산
      fast: 5
      slow: 20
    rsi2:                   # 평균회귀: RSI(2) 과매도 매수, MA5 회복 청산
      period: 2
      entry_below: 10
      exit_ma: 5
    us_dip:                 # 미국장 연계: 나스닥 전일 -1.5% 이하 → 시가 매수, 3일 보유
      threshold: -0.015
      hold_days: 3
    pullback:               # 평균회귀(조건부): 상승장 눌림목 — 2026-08-07 사전 등록
      # 가설: 무필터 rsi2의 실패(통과 0/12 — 승률 57~66%인데 MDD -22~-68%)는
      #   하락장에서 과매도를 사는 데서 온다. 장기 상승추세(종가>MA200) 안의
      #   단기 과매도만 사면 평균회귀가 성립한다 (Connors RSI2 표준형 —
      #   우리가 검증한 것은 트렌드 조건이 빠진 변형이었다).
      # 주의: crash_study의 MA200 게이트 기각(2026-08-07)은 '추세추종 진입에
      #   덧씌운 필터' 실험이었다. 여기서는 평균회귀 전략 정의의 구성요소로
      #   역할이 반대다 — 혼동 방지를 위해 사전 등록 시점에 기록.
      # 파라미터는 rsi2 동결값 재사용 + 문헌 표준 200 — 그리드서치 금지, 1회 판정.
      period: 2
      entry_below: 10
      exit_ma: 5
      trend_ma: 200
    trend_ride:             # 추세추종(장기): 상승장 추세 라이더 — 2026-08-07 사전 등록
      # 가설: 돌파 계열이 지배적인데 최대보유 10일 캡이 추세 이익을 자른다.
      # 중기 상승장(MA20>MA60 정배열)에서 20일 신고가로 진입하고, 추세 이탈
      # (종가<MA20)까지 보유를 연장하면 트레이드당 이익이 커질 것이다.
      # 파라미터는 전부 기존 관례/표준값 재사용 — 그리드서치 금지, 1회 실행 판정.
      lookback: 20          # 진입 신고가 창 (breakout과 동일 관례)
      trend_fast: 20        # 정배열 빠른 이평 (월)
      trend_slow: 60        # 정배열 느린 이평 (분기)
      exit_ma: 20           # 추세 이탈 청산선 = trend_fast
      max_hold: 60          # 안전 상한(~3개월) — 전략별 값이 기본 10일 캡을 대체
    tom:                    # 캘린더: 월말월초 효과 — 2026-08-07 사전 등록
      # 가설/근거: 주식 수익이 월초 며칠에 집중된다 — Ariel(1987),
      #   Lakonishok & Smidt(1988, 다우 90년), McConnell & Xu(2008 FAJ,
      #   35개국 중 34개국 확인 — 한국 포함). 원인 추정: 월급·연금·펀드의
      #   월 단위 자금 유입과 기관 리밸런싱. 추세추종(가격 패턴)·평균회귀
      #   (과매도 반등)와 독립된 캘린더/자금흐름 메커니즘 — 종결 계열의
      #   변형이 아닌 새 가설.
      # 구현 선택(성과 미참조, 등록 시 확정): 문헌 창은 월말 1일+월초 3일
      #   (T-1~T+3)이지만, 월말 진입은 '오늘이 이 달 마지막 거래일인지'를
      #   데이터만으로 당일 아침에 알 수 없어(휴장 캘린더 필요) 라이브
      #   프리뷰와 백테스트가 어긋난다. → 월초 첫 거래일 시가 진입(직전
      #   봉과 월이 달라진 것으로 판별 — 라이브에서 확실) + 3거래일 보유.
      #   문헌 효과의 보수적 부분집합이다.
      # 시험 범위: 기본 유니버스 12종 x 1 = 12테스트 (누적 116 → 128).
      #   확장 유니버스(채권·원유 등)는 제외 — 주식형 자금흐름 가설이므로
      #   메커니즘상 대상 아님 (성과 미참조 원칙에 따른 사전 결정).
      #   KODEX_Inverse 음수면 가설 방향과 정합 (trend_ride 때와 같은 구조 검증).
      # 게이트: Stage 1 동일 (N>=30, 전/후반 양수, t>=2). 그리드서치 금지.
      hold_days: 2          # 월초 1일 시가 진입 → 3일 종가 청산 (T+1~T+3).
                            # 엔진 held 카운트가 진입일=0이라 '2'가 3거래일 창이다
    ewy_up1:                # 교차상장 신호: EWY 추종 — 2026-08-11 사전 등록
      # 가설/근거: 미국 상장 한국 ETF(EWY, iShares MSCI Korea)는 한국이 자는
      #   밤에 '한국에 대한 미국의 평가'를 가격에 반영한다 — 교차상장 가격발견
      #   문헌. 전일(미국) EWY가 강하면 다음날 KR 주식 ETF가 이를 따라간다.
      #   기존 나스닥·SOX 신호(시장 전반)와 정보가 다르고(한국 특정),
      #   종결된 us_dip(미국 하락 역추세 매수)과 방향이 반대(지속 추종) —
      #   다른 메커니즘임을 등록 시점에 명시. 정렬은 기존 merge_asof 규칙
      #   (미국 날짜 < D — 룩어헤드 방지 인프라 재사용).
      # 파라미터(자유도 제거): 임계 +1%/+2%는 signals 하우스 밴드(sox up1/up2)
      #   재사용, 보유 1일(진입 익일 종가 청산 — 엔진 최소 보유)로 고정.
      # 시험 범위: 한국 주식 대표 2종(KODEX200, KODEX_Lev — universe 필드로
      #   제한) x 임계 2개 = 4테스트 (누적 140 → 144). 나스닥100 등 비한국
      #   자산은 메커니즘상 대상 아님. 게이트 동일(N>=30, 전/후반 양수, t>=2).
      threshold: 0.01
      hold_days: 1
      universe: ["069500", "122630"]   # 전략별 제한 유니버스 (본 스크리닝 제외)
    ewy_up2:                # 위와 동일 가설, 강신호 컷 (+2% — 하우스 밴드 up2)
      threshold: 0.02
      hold_days: 1
      universe: ["069500", "122630"]
    volbreak:               # 장중 모멘텀: 변동성 돌파 — 2026-08-10 사전 등록
      # 가설/근거: 장중에 '시가 + 전일 변동폭의 k배'를 넘는 강한 상승은 단기
      #   모멘텀 점화로, 다음날 시가까지 이어진다 — Larry Williams(Long-Term
      #   Secrets to Short-Term Trading)의 변동성 돌파. 국내 퀀트 서적이
      #   표준 전략으로 정착시킴 (강환국 「퀀트 투자 무작정 따라하기」·
      #   「할 수 있다! 퀀트 투자」 — k=0.5 관례). 기존 계열과의 차이:
      #   전일 종가 신호(일봉 시간대)가 아니라 당일 장중 돌파(일중 시간대) +
      #   익일 시가 청산(오버나이트 보유) — 정보 집합·보유 기간이 다른 새 가설.
      # 체결 모형(등록 시 확정): 매수가 = max(시가, 트리거) — 시가가 이미
      #   트리거 위면 시가 체결(현실적), 아니면 트리거 도달 시 그 가격.
      #   실전 체결은 스탑 매수 특성상 이보다 불리할 수 있음(슬리피지 방향이
      #   전략에 불리)을 등록 시점에 명시 — 판정 시 비용표와 함께 해석.
      #   당일 트리거 후 다음 봉이 없으면(미완성) 트레이드 미계상.
      # 실행 가능성: 트리거 가격은 전일 변동폭으로 개장 전 확정 —
      #   아침에 조건부(스탑) 매수 주문을 걸 수 있어 라이브 구현이 순수하다.
      # 시험 범위: 기본 유니버스 12종 x 1 = 12테스트 (누적 128 → 140).
      #   게이트 동일 (N>=30, 전/후반 양수, t>=2). k 그리드서치 금지.
      k: 0.5                # 전일 (고가-저가) 배수 — Larry Williams/국내 관례 표준
    overnight:              # 야간: 장중 모멘텀의 야간 지속 — 2026-08-26 사전 등록
      # 사전 등록 전문: PREREG_overnight.md (실행 전 커밋 — git이 선후를 증명).
      # 가설/근거: 주식 수익은 장중이 아니라 밤(종가→익일 시가)에 집중되고,
      #   당일 장중에 강했던 종목일수록 야간 수익이 크다 — Cliff, Cooper &
      #   Gulen(2008) 야간/주간 비대칭, Berkman 외(2012 JFQA) 개장 관심 매수,
      #   Lou, Polk & Skouras(2019 JFE) 모멘텀의 야간 발생. 국내 퀀트 커뮤니티
      #   '오버나이트' 관례 전략. 본 프로젝트 독립 증거와 정합: us_dip/ewy 기각
      #   = "야간 정보는 시가에 이미 반영" — 시가에 사는 쪽이 아니라 시가에
      #   파는 쪽(야간 보유 후 시가 매도)에 서는 가설이다.
      # 규칙(자유도 제거): 당일 장중 수익률(종가/시가-1) > 0 이면 종가 매수
      #   (동시호가 근사) → 익일 시가 매도. 보유 1일 고정. 컷 0은 부호 컷
      #   (자연 상수 — 튜닝 아님), 다른 컷(+1% 등) 시험 금지. 종가 진입은
      #   플래그 방식(신호 익일 시가 진입) 밖이라 전용 엔진 simulate_overnight.
      # 라이브 주의(등록 시 명시): 실전은 15:20 동시호가 직전 현재가로 신호를
      #   근사하므로 종가 근처 ±0 경계에서 백테스트와 어긋날 수 있다 —
      #   Stage 2 진입 시 preview 플래그로 실측한다.
      # 등록된 우려: (1) 연 ~120건/종 고회전이라 왕복 0.1% 비용이 문헌상
      #   수 bp/일 야간 엣지를 지울 가능성이 높다 — 게이트 실패가 예상
      #   시나리오이며, 실패해도 컷 변경 재시험 없이 종결(기각도 지식).
      #   (2) volbreak도 야간을 보유한다 — 신호일 중복률·슬리브 일간 수익
      #   상관을 리포트에 병기하고 |ρ|>0.5 면 운영상 같은 리스크 그룹 취급.
      # 홀드아웃 확인(사전 등록): 게이트 통과분은 같은 실행에서 홀드아웃
      #   구간(config holdout, 2009~2014)에 1회 적용해 방향(평균 부호) 확인 —
      #   음수면 Stage 2 편입 보류(우연 통과 가능성 우세로 기록).
      # 시험 범위: 기본 유니버스 12종 x 컷 1 = 12테스트 (누적 144 → 156).
      #   게이트 동일(N>=30, 전/후반 양수, t>=2) + 12종 동시 신호 구조라
      #   일 단위 교정 t를 리포트에 병기 (volbreak 선례 — 나이브 t는 부풀려짐).
      entry_above: 0.0      # 장중 수익률 부호 컷 — 자연 상수 (튜닝 아님, 변경 금지)
    flow:                   # 수급: 외국인 순매수 추종 — 2026-08-26 사전 등록
      # 사전 등록 전문: PREREG_flow.md (실행 전 커밋 — overnight 관례).
      # 가설/근거: 한국 시장 외국인 순매수는 지속성이 있고 단기 수익률을
      #   선행한다 — Choe/Kho/Stulz(1999 JFE, 한국 외국인 양의 피드백),
      #   Froot/O'Connell/Seasholes(2001 JFE), Richards(2005 JFQA).
      #   이 프로젝트가 처음 시험하는 정보 축(수급) — "소급 가능 데이터는
      #   새 가설 등록 시점에 받는다"(08-11 원칙)의 첫 적용.
      # 규칙(자유도 제거): 해당 시장 외국인 순매매(억원) 5거래일 롤링합이
      #   양전 크로스(<=0 → >0)한 날 D → D+1 시가 매수. 청산은 롤링합(D-1)<0
      #   이면 D 종가 — 의도적 1일 지연 (D 종가 시점엔 D의 확정 수급을 모른다).
      #   최대 보유 10일(하우스 캡). 창 5일=1주 자연 단위 — 변형 시험 금지.
      # 시점 정의: 수급(D)은 D 장 마감 후 확정 → 진입은 가격 전략의 shift(1)과
      #   동일 구조. 로더가 confirmed_cutoff 이전의 당일 잠정 행을 버린다.
      # 데이터: KRX 공식(pykrx)은 익명 차단 실측("LOGOUT", 2026-08) — 네이버
      #   금융 일별 확정치(2009~)로 공급, data/flow_{market}.parquet 캐시.
      #   수급은 소급 수집 가능이라 공급 단절에도 리플레이 장부는 무손실.
      # 시험 범위: 시장 수급 → 해당 시장 지수 ETF만 4테스트 (누적 156 → 160).
      #   게이트 동일 + 일단위 교정 t·가격 모멘텀(trend 후보) 중복 진단 병기.
      #   통과분은 홀드아웃(2009~14) 방향 확인 — KOSDAQ150 2종은 2015 상장이라
      #   확인 불가 → 통과해도 편입 보류(독립 재현 없는 단독 통과는 약함).
      window: 5             # 롤링합 창 = 1주 (자연 달력 단위 — 변경 금지)
      universe: ["069500", "122630", "229200", "233740"]   # 본 12종 스크리닝 제외
      markets:              # 코드 → 수급 시장 매핑 (메커니즘 고정)
        "069500": KOSPI
        "122630": KOSPI
        "229200": KOSDAQ
        "233740": KOSDAQ

etf_rotation:
  # 듀얼 모멘텀 로테이션 (2026-08-07 사전 등록 — 1회 실행 판정, 그리드서치 금지)
  # 가설: 12종 유니버스에서 12개월 모멘텀 상위 보유 + 절대 모멘텀(>0) 필터는
  #   개별 ETF 타이밍(돌파 계열)과 독립인 횡단면 프리미엄을 만든다
  #   (Antonacci 듀얼 모멘텀 / Faber 로테이션 표준형).
  # 규칙(전부 문헌 표준 — 선택 자유도 없음): 매월 마지막 거래일 종가로 252일
  #   수익률 산출 → 양수(절대 모멘텀)인 것 중 상위 top_k를 다음 거래일 시가에
  #   동일비중(슬롯 1/3) 리밸런스. 나가는 포지션 같은 시가 청산(왕복 0.1%),
  #   자격 미달 슬롯은 현금(수익 0). 유니버스는 etf.universe 그대로(변경 금지).
  # 판정: Stage 1과 동일 기준을 포지션 에피소드에 적용 — N>=30, 전/후반
  #   (2021 경계, 각 n>=10) 모두 양수, t>=2. 벤치마크(KODEX200 B&H)는 참고치.
  lookback: 252
  top_k: 3

etf_rotation2:
  # 확장 로테이션 (2026-08-07 사전 등록 — 기각된 rotation의 유일한 재도전 경로).
  # 가설: rotation 실패 원인은 유니버스의 횡단면 분산 부족 — 자산군 다변화
  #   (주식 KR/US/CN/JP, 채권 KR/US, 달러, 원유, 금, 리츠)면 듀얼 모멘텀이 성립한다.
  # 유니버스: universe + universe_ext 에서 파생형(레버리지·인버스) 제외 —
  #   정통 자산군 로테이션은 무레버리지 기초자산을 쓴다 (사전 원칙, 성과 미참조).
  # 파라미터는 rotation과 동일 표준값 고정, 판정도 동일(N>=30, 전/후반 양수, t>=2).
  # 기각 시 로테이션 프로그램 종료 — 추가 유니버스 변형 재시도 금지.
  exclude: ["122630", "233740", "114800"]
  lookback: 252
  top_k: 3
  # Stage 2 편입 (2026-08-07 — 인샘플 통과 t=2.40): freeze 이후 진입 에피소드만
  # 아웃오브샘플로 etf_ledger.csv(strategy=rotation2)에 축적. 판정은 완결 에피소드
  # judgment_min 건 도달 시(과거 6.7건/년 → 약 3년). 그 전 실거래 금지.
  freeze: "2026-08-07"
  judgment_min: 20
  # 결정 규칙 (2026-08-07 등록 — 에피소드 장부 0행 시점, 변경 금지):
  # 완결 순 처음 20건에서 평균>0 AND 단측 t>=judgment_t (alpha=0.05, df=19), 1회.
  # 독립 계열이라 스윙의 '계열 통과 전제 부호 규칙'을 못 쓴다 — 단독 부호 규칙은
  # 엣지 없어도 50% 확률로 채택되는 동전던지기. 인샘플 sd(에피소드당 20.2%) 기준
  # 검정력 ~34%로 낮음을 등록 시점에 명시한다 — 6.7건/년이라 표본을 늘리면
  # 판정이 6년 지평이 되는 것과의 트레이드오프에서 20건을 선택.
  # 미통과 시 로테이션 프로그램 종료 (순차 재검정 금지, 재도전은 새 가설 등록만).
  judgment_t: 1.729          # t(0.95, df=19)
  judgment_power_note: "34%"

holdout:
  # ================= 사전 등록 (2026-08-14, 결과 관측 전 확정) =================
  # 가설: config etf_paper.candidates 에 동결된 후보 규칙(파라미터·exit 모드 포함)을
  #   개발에 한 번도 쓰지 않은 과거 구간에 **그대로** 적용하면, 인샘플과 같은
  #   방향(평균>0)의 성과가 재현된다.
  # 왜 지금: 다중검정 보정(mtest) 결과 trend/tom/rotation2 후보는 "인샘플만으로는
  #   우연과 구분 불가"로 나왔다. 포워드 판정(2.3년)을 기다리지 않고 얻을 수 있는
  #   유일한 추가 증거가 '안 본 과거 데이터'다.
  #
  # --- 구간 (데이터 실측으로 확정 — 희망사항 아님) ---
  # yfinance 한국 ETF 일봉은 2007~2008 이 사실상 비어 있다(2007년 10일, 2008년 2일).
  # 연속 데이터는 2009-04-17 부터 — 즉 **2008 금융위기는 시험에 포함되지 않는다.**
  # 대신 2011 유럽 재정위기와 2012~2014 장기 박스권이 들어간다. 박스권은 추세추종에
  # 구조적으로 불리하므로 이 시험은 관대하지 않다 (그 점이 시험의 가치다).
  start: "2009-04-17"
  end: "2014-12-31"         # 인샘플 시작(data.start 2015-01-01) 직전까지 — 겹침 0
  #
  # --- 데이터 (기준 정합성 실측 검증 완료) ---
  # FDR은 10년치만 주므로 yfinance 사용. 단 yfinance 한국 ETF는 OHLC 가 배당조정
  # 기준이고 Adj Close 가 원가격이다(통상과 반대 — 실측 확인). 그대로 쓰면 인샘플
  # (FDR 미조정가)과 기준이 달라 총수익 편향이 생기므로 역산해 되돌린다:
  #   원가격 OHLC = OHLC x (Adj Close / Close)
  # 2015+ 겹침 2,820일 검증: 일간수익률 중앙오차 0.2~1.0bp, 일중폭 중앙오차 0.12%,
  # 시가/종가 비율 오차 <9bp. 캐시는 data/holdout_{code}.parquet 로 **완전 분리**
  # (라이브 FDR 캐시를 절대 덮지 않는다).
  #
  # --- 시험 대상 (전수 — 골라내지 않는다) ---
  # Stage 2 등록 후보 중 구간 데이터가 있는 것 전부. 제외 2건과 사유:
  #   KODEX_Battery volbreak — 2018 상장, 구간 데이터 0
  #   rotation2 — 확장 유니버스 다수가 미상장이라 규칙 자체를 재현 불가
  # 성적을 보고 대상을 고르는 일은 없다 (그러면 홀드아웃이 아니라 2차 탐색이 된다).
  #
  # --- 비용 ---
  # 판정 비용표(results/etf_costs.csv judgment_cost) 사용 — judge 와 동일 관례.
  # 2026 실측치를 2009~2014 에 적용하는 것이라 당시 실제 비용보다 낮을 수 있어
  # 전략에 유리한 방향이다. 그래서 2배 비용 민감도를 함께 보고한다(robustness 관례).
  cost_stress: 2.0
  #
  # --- 판정 규칙 (계열별 1회. 결과를 본 뒤 바꾸면 사전 등록 무효) ---
  # 계열 구분은 기존 family 그대로 — 메커니즘이 다른 전략을 한 풀에 섞지 않는다.
  # volbreak 만 '일 단위 집계'인 이유: 6후보가 같은 날 동시 트리거되는 고상관
  # 구조라 트레이드 풀 t 가 부풀기 때문(등록 시 나이브 t=8.75 → 일 단위 2.38).
  # 같은 날 여러 후보의 트레이드를 평균해 관측치 1개로 만든 뒤 검정한다.
  families:
    trend:    {pool: trade, t: 1.66}
    tom:      {pool: trade, t: 1.699}
    volbreak: {pool: daily, t: 1.66}
  #
  # --- 결론 규칙 (무엇을 기록하고 무엇을 바꾸지 않는가) ---
  # **어느 결과가 나오든 config 의 판정 기준·후보 목록·파라미터는 불변이다.**
  # 이미 동결된 포워드 판정 절차를 새 시험 결과로 고치면 그게 사후 기준 변경이다.
  # 이 시험이 바꾸는 것은 '기록되는 결론'뿐이며, 그 결론을 미리 못 박아 둔다:
  #   통과(평균>0 AND t>=임계) → "다른 레짐에서도 재현됨 — 인샘플 근거 보강"
  #   미달(평균>0, t 미달)     → "판별 불가 — 표본/레짐 한계"
  #   실패(평균<=0)            → "인샘플 성적이 다른 레짐에서 재현되지 않음."
  #     포워드 판정을 통과하더라도 실거래 편입 결정에 이 사실을 반증 자료로 병기한다.
  # **1회 실행.** 구간·비용·후보·파라미터를 바꿔 재실행 금지 (그 순간 탐색이 된다).
  # 시험 수 회계: 이것은 인샘플 전략 탐색이 아니라 동결 규칙의 재현 시험이므로
  # multiple_testing.declared_trials(144)를 늘리지 않는다. 대신 계열 검정 3건이
  # 수행됐다는 사실을 리포트에 남긴다.

xmarket:
  # 교차 시장 복제 (2026-08-26 사전 등록 — 전문 PREREG_xmarket.md, 1회 실행).
  # trend 계열 동결 정의를 미국 지수 ETF 2000~2014(닷컴 붕괴+2008 포함,
  # 한국 인샘플과 시대 불겹침)에 그대로 적용 — 홀드아웃과 같은 재현 시험이라
  # declared_trials 에 가산하지 않는다. exit 는 기본형(ma) — 채택 trail 변형은
  # 한국 후보 선택의 산물이라 배제. 데이터는 미조정 원가격(배당 낙폭이 전략에
  # 불리한 방향 = 보수적), 비용 0.1% 유지(미국 실제보다 보수적).
  symbols:
    SPY: US_SP500
    QQQ: US_NASDAQ100
    DIA: US_DOW30
    IWM: US_RUSSELL2000
  start: "2000-01-03"
  end: "2014-12-31"
  strategies: [breakout, macross, trend_ride]
  family_t: 1.66            # 계열 풀 단측 t 임계 — holdout trend 규칙과 동일

multiple_testing:
  # 다중검정 보정 (2026-08-14 추가 — 사후 진단 전용, `python -m src.main mtest`).
  # 왜: 누적 144회 탐색을 기록해 놓고 정작 후보 평가에는 반영한 적이 없었다.
  #   시험을 늘릴수록 '최고 성적'의 잡음 기준선이 올라가는데 게이트는 t>=2 고정이었다.
  # 무엇이 아닌가: 새 전략·파라미터·데이터를 도입하지 않는다 → 시험 수 불변.
  #   판정 기준(etf_paper.judgment)은 동결 상태 그대로이며 이 결과로 바꾸지 않는다
  #   (사후 기준 변경 금지). 출력은 해석 자료.
  declared_trials: 160
  # ^ CLAUDE.md 누적 스크리닝 테스트 수 (2026-08-26 overnight 12 + flow 4 추가로
  #   144 → 160). 코드로 재현 가능한 조합은 142개(스크리닝 140 + 로테이션 2)지만,
  #   refine(레짐필터·청산)·crash(MA200 게이트) 변형 시험도
  #   실제 탐색 강도에 포함되므로 선언값을 기준선으로 쓴다 (보수적 방향).
  fdr_q: 0.10                # Benjamini-Hochberg 목표 위양성 발견율
  bootstrap:
    draws: 2000
    block_days: 20           # 정상 부트스트랩 평균 블록 (portfolio 관례와 동일)
    seed: 11                 # 재현성 — 매 실행 동일 p값

health:
  # 헬스체크 임계값 (운영 파라미터 — 코드 하드코딩 금지 규칙 준수)
  stale_busdays: 3            # 가격 캐시 허용 지연 (KR 공휴일 미반영 — 연휴 오탐 감수)
  log_max_age_days: 5         # evening 로그 최대 나이
  revision_window_days: 7     # 데이터 정정 경고 감시 창
  snapshot_max_age_days: 7    # paper/ 자동 커밋 최대 나이 (Phase C 생존 감시 —
                              # 아침 preview_signals 갱신으로 평일 매일 커밋이 정상)

etf_paper:
  # Stage 2 사전 등록 (2026-08-06 동결) — Stage 1 스크리닝 통과 후보 4개.
  # freeze_date 이후 진입분만 아웃오브샘플. 후보 변경 시 freeze 갱신, ledger 보존.
  # 나중에 추가된 후보는 자체 freeze 필드를 갖는다(기존 후보 동결 불변) —
  # 향후 자동매매의 전략 선택은 이 목록에서 (code, strategy, exit) 단위로 고른다.
  freeze_date: "2026-08-06"
  ledger: paper/etf_ledger.csv
  preview_deadline: "09:00"   # 개장 시각 — 이전에 프리뷰가 신호를 보였어야
                              # '실거래 가능(ok)' 트레이드로 분류 (preview 컬럼)
  trailing_stop: 0.05   # 채택된 exit 변형의 라이브 파라미터 (refine 섹션은 재현용 사본)
  judgment:
    # 판정 기준 사전 등록 (2026-08-07 v2 — ETF 장부 0행 시점 확정, 이후 변경 금지).
    # v1(같은 날 오전)은 표본 크기만 등록하고 판정 시점에 적용할 검정을 등록하지
    # 않았다 — 데이터를 본 뒤 검정을 고르면 사후 선택이 되므로, 같은 날 저녁
    # (evening 리플레이 후에도 완결 트레이드 0건임을 확인하고) 결정 규칙까지
    # 완결 등록한다. 검정력 근거: 후보별 20건 t>=2는 인샘플 재현 가정에서도
    # 검정력 11~27%라 판정 도구로 성립하지 않음. 풀링 120건 단측 t>=1.66은 85%.
    #
    # [1] 계열 판정 (1회, 순차검정 금지):
    #     합산 완결 pooled_n 건 도달 시점에 전 후보 풀링 평균>0 AND 단측
    #     t >= family_t (alpha=0.05). 통과 못 하면 스윙 계열 전체 실거래 불가
    #     — 재판정 없음(관측은 계속하되 새 가설 사전 등록으로만 재도전).
    # [2] 후보 채택 (계열 통과가 전제):
    #     후보별 완결 per_candidate_min 건 이상 AND 후보 평균>0 인 것만 실거래
    #     편입 (부호 규칙 — 인샘플 재현 가정 검정력 83~94%). 미달 후보는
    #     도달 시점에 같은 규칙 적용.
    # [3] 후보 제거: 후보별 per_candidate_min 건에서 평균<=0 이면 제외.
    # [4] 판정 통계의 비용: 장부 net_ret(왕복 0.1% 가정)이 아니라 ETF별 실측
    #     추정 비용(results/etf_costs.csv — 생성 시점 동결)으로 재계산한다.
    # 과거 빈도(2015-01~2026-08, 11.6년): 7후보 합산 52.5건/년 → pooled_n 약 2.3년.
    #
    # v2.1 (2026-08-07 저녁, 장부 여전히 0행): 계열(family) 구조화 — trend 계열의
    # 등록값(120건, t 1.66)은 그대로이고, 메커니즘이 다른 신규 계열(tom)이 같은
    # 풀에 섞여 시험을 오염시키지 않도록 계열별 기준으로 배치만 바꿈.
    families:
      trend:                 # 추세추종 계열 (breakout/macross/trend_ride 7후보)
        pooled_n: 120        # [1] 계열 판정 표본 (약 2.3년) — v2 등록값 불변
        t: 1.66              # [1] 단측 t 임계 (alpha=0.05) — v2 등록값 불변
      volbreak:              # 장중 계열 (2026-08-10 등록 — 6후보, 후보별 판정)
        mode: per_candidate  # 계열 풀링 검정을 두지 않는다 — 등록 시 계산 근거:
        # 6후보가 같은 날 동시 트리거되는 고상관 구조라 트레이드 풀 t가 3.7배
        # 부푼다(나이브 8.75 vs 일단위 교정 2.38). 일 단위로 교정하면 어떤
        # 표본으로도 검정력이 부족(22개월 24%). 후보별로는 빈도가 높아
        # (연 69~106건) 개별 검정이 성립 — 인샘플 재현 가정 검정력:
        # Semicon 83% / Securities 52% / Auto 23% / Battery 19% / NDX 15% /
        # Lev 9%. 하위 후보는 미통과 시 해당 후보만 제거되는 구조.
        n: 300               # 후보별 완결 300건 (약 3년, Battery만 ~4.3년)
        t: 2.408             # 단측 alpha=0.05/6 (Bonferroni — 6후보 다중성 보정)
      tom:                   # 캘린더 계열 (2026-08-07 등록 — KODEX_Gold 단일 후보)
        pooled_n: 30         # 12.0건/년 → 약 2.5년. 단일 후보라 계열 판정=후보 판정
        t: 1.699             # 단측 alpha=0.05 (df=29)
        # 검정력 ~30% (인샘플 평균 +0.33%, sd 1.57% 재현 가정) — rotation2와 같은
        # 표본 제약의 정직한 귀결. 주의: 주식 자금흐름 가설인데 주식 ETF가 아니라
        # 금만 게이트를 통과 — 가설 정합성이 약해 우연 통과 가능성이 상대적으로
        # 높다. 판정 미통과 시 재시도 없이 계열 종결.
      overnight:             # 야간 계열 (2026-08-26 등록 — KODEX_Semicon 단일 후보)
        mode: per_candidate  # 단일 후보라 계열 판정 = 후보 판정. 편입 시점 등록:
        # 빈도 118건/년 → 300건 약 2.5년 (volbreak 지평과 정렬). 임계는 단일
        # 후보라 다중성 보정 없음 — 단측 alpha=0.05 (df=299 → 1.650).
        # 검정력 ~28% (인샘플 평균 +0.078%, sd 1.28% 재현 가정) — tom(30%)·
        # rotation2(34%)와 같은 약검정력임을 정직하게 명시. Semicon 실측 비용
        # 0.100% <= 일괄 0.1% 라 max 규칙 페널티 없음 (판정 t 동일).
        # 미통과 시 계열 종결 — 컷·대상 변형 재시도 금지.
        n: 300               # 후보별 완결 300건 (약 2.5년)
        t: 1.650             # 단측 alpha=0.05 (df=299, 단일 후보 — 보정 없음)
    per_candidate_min: 20    # [2][3] 후보별 채택/제거 최소 표본 (다후보 계열만)
  execution_gate:
    # 실전 투입 게이트 (2026-08-26 등록 — 판정 표본이 쌓이기 전에 동결).
    # 판정(judgment)은 '신호가 진짜인가'만 답한다. 실전 투입은 추가로 '체결로
    # 살아남는가'를 요구한다 — 이 기준을 3년 뒤 데이터를 다 본 시점에 만들면
    # 사후 결정이 되므로 지금 못 박는다. judge 가 상태를 매 실행 표시한다.
    # 규칙 (판정 통과가 전제 — 게이트는 판정을 대체하지 않는다):
    # - volbreak (스탑 매수 — 슬리피지 방향이 구조적으로 불리):
    #   fillcheck 보수 체결 기준 평균 > 0 AND 분봉 표본 min_minute_days 이상.
    #   (보수 체결 = 최초 도달 5분봉 종가 — 상한 추정이므로 이 게이트는 보수적)
    # - 그 외 계열 (시가/종가 동시호가 체결 — 슬리피지 대칭):
    #   preview ok 부분집합(개장 전 인지 = 실거래 가능했던 트레이드) 평균 > 0.
    #   ok 표본이 판정 표본의 절반 미만이면 '증빙 부족'으로 투입 보류.
    volbreak: {rule: conservative_fill_positive, min_minute_days: 120}
    default: {rule: preview_ok_positive, min_ok_ratio: 0.5}
    pooled_checkpoint: 30    # 중간점검 전용 (약 9개월, 08-06 계열 4후보 집계) —
                             # 실거래 근거 아님. 진행 상황 가시화 용도만.
  candidates:
    # exit: ma(기본) | trail_only | ma_plus_trail — refine 실험(2026-08-06) 채택분 반영
    - {code: "069500", name: KODEX200, strategy: breakout}
    - {code: "091180", name: KODEX_Auto, strategy: macross, exit: ma_plus_trail}
    - {code: "122630", name: KODEX_Lev, strategy: breakout}
    - {code: "133690", name: TIGER_NASDAQ100, strategy: breakout, exit: trail_only}
    # trend_ride 계열 (2026-08-07 등록) — Stage 1 12조합 중 사전 선언 게이트
    # (N>=30, 전/후반 양수, t>=2) 통과분 전부, 사후 선별 없음. 과거 빈도
    # 3.8~6.2건/년 → 후보별 20건 판정까지 약 3.2~5.3년 (장기 관측 전제).
    - {code: "069500", name: KODEX200, strategy: trend_ride, freeze: "2026-08-07"}
    - {code: "133690", name: TIGER_NASDAQ100, strategy: trend_ride, freeze: "2026-08-07"}
    # 확장 스크리닝 통과분 (2026-08-07 등록 — 신자산 8종 x 생존 3계열 중 유일 통과.
    # 채권축이라 기존 주식 후보와 상관 낮음. t=2.04, MDD -2.2%)
    - {code: "148070", name: KOSEF_KTB10Y, strategy: trend_ride, freeze: "2026-08-07"}
    # tom 계열 (캘린더 — family 필드가 판정 풀을 가른다. 기본값은 trend)
    - {code: "132030", name: KODEX_Gold, strategy: tom, family: tom, freeze: "2026-08-07"}
    # volbreak 계열 (장중 변동성 돌파 — 2026-08-10 스크리닝 6/12 통과분 전원 편입.
    # 포트폴리오 시뮬 미편입: 1일 회전 별도 슬리브 — rotation2 선례.
    # 주의 2건 등록: (1) 후반부(2021~) 평균이 전반 대비 크게 감소 — 알파 소멸
    # 가능성, (2) 스탑 매수 체결은 모형보다 불리할 수 있음 — 판정 시 함께 해석)
    # overnight 계열 (야간 보유 — 2026-08-26 스크리닝 1/12 통과분 편입.
    # 등록 절차(PREREG_overnight.md)대로: 게이트 통과 + 홀드아웃(2009~14) 방향
    # 양수(+0.084%, t=2.61, N=673) 확인 후 편입. 정직 기록 3건:
    # (1) 계열 가설 자체는 기각 수준 — 12종 풀 일단위 t=-3.31, 10/12 미달.
    #     '광범위 야간 프리미엄'은 한국 ETF에서 비용을 못 이긴다 (등록된 예상
    #     시나리오). 단일 통과는 tom의 '금만 통과' 경고 패턴과 유사 — 다만
    #     tom과 달리 홀드아웃이 양수로 재현된 점이 차별점 (tom은 -0.094%).
    # (2) 인샘플 t=2.27은 156회 탐색의 잡음 상한(mtest 기대 최대 t ~2.7) 아래 —
    #     인샘플만으로는 우연과 구분 불가, 판정은 포워드+홀드아웃 근거.
    # (3) volbreak 슬리브와 일간 수익 상관 rho=0.54, Semicon 신호일 중복 69.9% —
    #     운영상 volbreak과 같은 리스크 그룹 취급 (동시 발동 시 노출 합산 캡,
    #     같은 ETF를 같은 밤 이중 보유하게 되는 날이 많다).
    - {code: "091160", name: KODEX_Semicon, strategy: overnight, family: overnight, freeze: "2026-08-26"}
    - {code: "091160", name: KODEX_Semicon, strategy: volbreak, family: volbreak, freeze: "2026-08-10"}
    - {code: "102970", name: KODEX_Securities, strategy: volbreak, family: volbreak, freeze: "2026-08-10"}
    - {code: "091180", name: KODEX_Auto, strategy: volbreak, family: volbreak, freeze: "2026-08-10"}
    - {code: "133690", name: TIGER_NASDAQ100, strategy: volbreak, family: volbreak, freeze: "2026-08-10"}
    - {code: "305720", name: KODEX_Battery, strategy: volbreak, family: volbreak, freeze: "2026-08-10"}
    - {code: "122630", name: KODEX_Lev, strategy: volbreak, family: volbreak, freeze: "2026-08-10"}

portfolio:
  # 포트폴리오 시뮬레이션 규칙 (2026-08-06 등록)
  # - 동일 지수 그룹은 동시 보유 금지: 신호 겹치면 그 시점 승률 점수 높은 쪽 선택
  # - 진입 비중 = (max_gross/3슬롯) x (점수/0.5), 남은 노출 예산 내로 클립
  #   (점수 = 해당 후보의 직전 완결 트레이드 승률, 표본 부족 시 0.5)
  # - 레버리지 ETF는 노출 2배로 계상
  # - 총노출 상한은 '역사적 MDD -8%'에 맞춰 2-pass 캘리브레이션 (리스크 캘리브레이션
  #   목적의 조정이며 신호 튜닝이 아님)
  target_mdd: -0.08
  # 2026-08-07 개정: 캘리브레이션 목표를 '실현 MDD(단일 경로 점추정)'에서
  # '블록 부트스트랩 MDD 하위 분위수'로 변경. 실현 -8.0%는 부트스트랩 분포의
  # ~30퍼센타일이라 점추정 방식은 5% 확률로 -12% 급 낙폭을 허용하고 있었다.
  # 리스크 캘리브레이션 방법론 교정이며 신호·판정 기준과 무관.
  bootstrap:
    quantile: 0.05     # 하위 5퍼센타일 MDD를 target_mdd에 맞춘다 (보수 쪽 꼬리)
    block_days: 20     # 블록 길이 (거래일) — 자기상관 보존용
    draws: 2000
    seed: 7            # 재현성 (매 실행 동일 분위수)
  max_gross_exposure: 1.0
  score_window: 100          # 승률 계산에 쓰는 최근 완결 트레이드 수
  score_min_trades: 10       # 이보다 적으면 점수 0.5 (중립)
  exposure_groups:
    # 그룹 정의 기준 (2026-08-07 개정): 이름/지수가 아니라 실측 상관.
    # 보유 중 일간 MTM 상관(동시 보유일 190~841일 기준)이 |rho|>0.5 면 동일 그룹 —
    # 청산일 손익 상관(0.59)은 동시 보유 공동변동을 못 잡아 분산을 과대평가한다.
    # 실측치: KODEX200-Lev 0.94, KODEX200-Auto 0.61, Lev-Auto 0.61 → 한 그룹.
    # TIGER_NASDAQ100 은 KODEX200 과 0.33, KOSEF_KTB10Y 는 전부 |rho|<0.15 → 별도.
    # (명목 7후보의 유효 독립 베팅수는 약 2.9개 — 분산 착시 주의)
    kr_equity: ["069500", "122630", "091180"]
  leverage:
    "122630": 2

refine:
  # 사전 등록 (2026-08-06 동결) — 두 실험 모두 그리드서치 금지, 1회 실행 판정.
  regime_filter:
    # 가설: 변동성 급등 레짐에서 신규 진입을 쉬면 돌파의 꼬리 손실이 줄어든다
    # 채택 기준: 전/후반 각각에서 (t-stat 유지·개선) AND (MDD 개선)
    vol_fast: 20            # ETF 자체 20일 변동성
    vol_slow: 60            # / 60일 변동성
    block_above: 1.5        # 비율 > 1.5 면 신규 진입 금지 (보유분은 유지)
  exit_rules:
    # 가설: 트레일링 스탑이 고정 MA 이탈보다 추세 이익을 길게 지킨다
    # 변형 2개만: trailing 단독 / MA+trailing 결합. 채택 기준: 전/후반 각각 t-stat 개선
    trailing_stop: 0.05     # 보유 중 최고 종가 대비 -5%

crash_study:
  # 폭락 사례 연구 + 방어 게이트 실험 (2026-08-07 사전 등록 — 1회 실행 판정).
  # Part 1 사례 정의(기술적 진단): 자체 종가가 60일 고점 대비 -10% 이하인 구간,
  #   20영업일 이내 재이탈은 같은 사례로 병합. 진단이며 통계적 선택 아님.
  # Part 2 확증 실험: MA200 게이트 — 신규 진입은 전일 종가 > 200일 이평일 때만
  #   (보유분은 유지). 기각된 refine.regime_filter(변동성비)와 다른 메커니즘(추세
  #   레벨)이고 200일은 표준값 — 그리드서치 금지. 가설이 사례 진단과 같은 인샘플에서
  #   나왔으므로 채택돼도 확증력은 제한적, 최종 판정은 포워드.
  # 채택 기준(refine 레짐 필터와 동일): 전/후반 각각 t-stat 유지·개선 AND MDD 개선.
  episode:
    lookback: 60
    drawdown: -0.10
    merge_gap: 20
  gate_ma: 200

analysis:
  # 신호 세기 분석: 주력 조건 발동일을 NVDA 하락폭 구간으로 쪼개 단조성 확인
  strength_condition: "kospi_down"        # 고정 조건 (nvda 구간과 AND)
  strength_bins: [-0.10, -0.05, -0.04, -0.03, -0.02]   # nvda_ret 구간 경계
  diagnose_year: 2024                     # 유일한 손실 연도 진단
  # 전이 검증: 확정 조건을 그대로 새 종목에 적용 (새 조건 탐색 금지 — 다중검정)
  transfer_condition: "nvda_down2 & kospi_down"
  transfer_stocks:
    "042700": HanmiSemicon
    "000990": DBHiTek
    "058470": LeenoIndustrial

sizing:
  # 사전 등록 실험 (2026-08-06 동결) — 2단 사이징.
  # 가설: 주력 조건 발동일 중 NVDA <= -3% 인 날에 더 크게 베팅하면
  #       리스크 조정 성과(Sharpe)가 균일 베팅보다 좋다.
  # 주의: -3% 임계값은 인샘플 분석(analysis)에서 나온 것 → 역사적 검증은
  #       전/후반 반쪽 일관성까지만 참고하고, 최종 판정은 섀도 포워드 성과로 한다.
  # 역사적 지지 기준: 전반부와 후반부 각각에서 tiered Sharpe > flat Sharpe
  condition: "nvda_down2 & kospi_down"
  strong_threshold: -0.03     # nvda_ret <= -3% 이면 강신호
  weak_weight: 0.5            # 약신호 베팅 비중 (자본 대비)
  strong_weight: 1.0          # 강신호 베팅 비중

minute:
  # 분봉 수집 (손절 룰 검증용) — yfinance 5분봉, 최대 60일 백필 + 매일 append
  symbol: "000660.KS"
  interval: "5m"
  cache: minute_SKHynix_5m.parquet   # data/ 아래
  # ETF 분봉 확장 수집 (2026-08-10 — 분봉은 60일 지나면 소급 불가라 지금부터 축적).
  # 측정·연구 재료 전용 — 신호·판정과 무관.
  # 1차: volbreak 6종 (등록된 주의② '스탑 매수 슬리피지' 실측 — fillcheck).
  # 2차: 나머지 Stage 2 후보 3종 (069500/148070/132030 — 향후 체결·손절 연구 대비,
  #      2026-08-11 커버리지 완성).
  etf_codes: ["091160", "102970", "091180", "133690", "305720", "122630",
              "069500", "148070", "132030"]

stoploss:
  # 사전 등록 (2026-08-06 동결): 주력 조건 발동일에 장중 손절이 성과를 개선하는가.
  # 손절 레벨은 아래 2개만 테스트 (그리드서치 금지). 판정은 분봉 확보된
  # 발동일 min_days 이상일 때만 유효 — 그 전에는 '표본 부족' 참고치.
  levels: [-0.02, -0.03]
  min_days: 30

ml:
  # 사전 등록 실험 (2026-08-06 동결) — 그리드서치·설정 변경 후 재실행 금지.
  # 가설: 연속값 피처를 쓰는 소형 GBM이 수동 룰보다 아웃오브샘플에서 낫다.
  # 채택 기준(셋 다 충족): OOS 거래수 >= min_trades,
  #   ML 누적 순수익 > 벤치마크 룰 누적 순수익, ML 평균 순수익 t-stat >= 2
  target_stock: SKHynix
  benchmark_condition: "nvda_down2 & kospi_down"
  oos_start: 2020            # 워크포워드 시작 연도 (2015~2019 최초 학습)
  features: [sox_ret, ixic_ret, nvda_ret, kospi_prev_ret, gap, ma20_dist]
  min_trades: 30
  model:                     # LGBMRegressor, 목표변수 = day_ret - cost
    n_estimators: 200
    learning_rate: 0.05
    max_depth: 3
    num_leaves: 7
    min_child_samples: 50
    subsample: 0.8
    colsample_bytree: 0.8
    reg_lambda: 1.0
    random_state: 42

ml_metalabel:
  # 사전 등록 설계 (2026-08-11 봉인 — 실행은 아래 게이트 충족 시 1회만).
  # 결과를 하나도 보지 않은 시점(volbreak 포워드 장부 0건)에 피처·프로토콜을
  # 확정한다. 실행 시점에 피처를 고르면 사후 선택 오염이 되기 때문.
  #
  # 가설(메타라벨링, López de Prado): volbreak 트리거(1층 신호 — 동결)는 그대로
  #   두고, 2층 ML이 '어떤 트리거가 성공하는가'만 분류하면 필터로 성과가 개선된다.
  #   1층 표본 6,619건(인샘플)은 이 프로젝트에서 유일하게 ML급 크기.
  #
  # 실행 게이트 (둘 다 충족 전에는 구현·실행 금지):
  #   (a) fillcheck 분봉 표본 120거래일 이상 축적
  #   (b) 그 표본에서 보수 체결(도달 5분봉 종가) 기준 평균 순수익이 양수인
  #       volbreak 후보 1개 이상 존재 — 체결 문제로 죽는 전략에 필터는 무의미
  # 아래 gate 블록은 위 (a)(b)를 코드가 읽는 형태로 옮긴 것 — 2026-08-11 봉인분과
  # 같은 값이며 새 파라미터가 아니다 (health/fillcheck 가 도달률을 매일 표시하도록).
  gate:
    minute_days: 120           # (a) 분봉 표본 축적 거래일
    min_positive_candidates: 1 # (b) 보수 체결 평균 양수 후보 최소 수
  #
  # 프로토콜 (기존 ml 실험 관례 동결값 재사용 — 자유도 제거):
  #   모델 LGBMClassifier, 하이퍼파라미터는 위 ml.model 값 그대로 (튜닝 금지).
  #   라벨 = (net_ret > 0). 워크포워드 = 2015~2019 학습 → 2020~ 연 단위 확장.
  #   필터 = 예측 성공확률 상위 1/2 진입 (컷 50% 고정 — 컷 탐색 금지).
  #   판정 = refine 관례의 '엄격 개선': 후보별로 필터 적용 성과가 무필터 대비
  #     전/후반 각각 t-stat 개선 AND 평균 개선 AND 필터 후 N>=150. 1회 실행.
  #   아침 스냅샷 피처는 축적 구간만 사용 (결측 구간은 결측으로 — 대체 금지).
  #
  # 피처 (트리거 순간에 알 수 있는 정보만 — 시점 정의를 코드보다 먼저 봉인):
  features:
    # [전일까지 확정 — 일봉]
    - prev_range_pct        # (H(D-1)-L(D-1)) / C(D-1) — 트리거 폭 자체
    - range_expand_5d       # 전일 range / 직전 5일 평균 range — 변동성 확장 여부
    - ret_1d                # C(D-1)/C(D-2) - 1
    - ret_5d                # C(D-1)/C(D-6) - 1
    - ret_20d               # C(D-1)/C(D-21) - 1
    - dist_ma20             # C(D-1)/MA20(D-1) - 1 — 추세 위치
    - dd_60d                # C(D-1)/max(C, 60일) - 1 — 레짐 (crash_study 관례)
    - vol_ratio_5d          # 전일 거래대금 / 직전 5일 평균 — 관심 집중도
    # [당일 09:00 확정 — 시가]
    - gap_open              # O(D)/C(D-1) - 1
    - trigger_dist_pct      # k x range(D-1) / O(D) — 트리거까지 거리
    # [트리거 도달 순간 확정 — 분봉 축적분만]
    - trigger_minute        # 도달 시각 (09:00 이후 경과 분) — 이른/늦은 돌파
    - cross_triggers        # 같은 날 먼저 트리거된 다른 volbreak 후보 수 (0~5)
    # [전일 미국·아침 스냅샷 — 기존 정렬 인프라/snapshot 재사용]
    - ixic_ret_prev         # 미국 D-1 나스닥 수익률 (merge_asof — 기존 규칙)
    - nasdaq_fut_morning    # 아침 스냅샷 선물 등락률 (전일 종가 대비, 축적분만)
    - usdkrw_morning        # 아침 스냅샷 환율 등락률 (축적분만)
    # [캘린더]
    - day_of_week           # 0~4
    - is_month_start        # 월초 첫 3거래일 여부 (tom 관례 재사용)

paper:
  # 포워드 페이퍼 테스트 — 사전 등록된 조건만 추적. freeze_date 이후가 아웃오브샘플.
  # 조건 변경/추가 시 freeze_date를 갱신하고 기존 ledger는 보존할 것.
  freeze_date: "2026-08-06"
  ledger: paper/ledger.csv
  conditions:
    - stock: SKHynix
      condition: "nvda_down2 & kospi_down"   # 주력 후보 (0.3% 비용에서도 t>=2)
    - stock: SKHynix
      condition: "sox_down1 & nvda_down2"
    - stock: SKHynix
      condition: "nvda_down2 & gap_down"
